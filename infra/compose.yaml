name: ai-video-studio

x-api-image: &api-image
  build:
    context: ../backend
  environment: &app-env
    APP_ENV: ${APP_ENV:-development}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    DATABASE_URL: postgresql+asyncpg://studio:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/studio
    MINIO_ENDPOINT: http://minio:9000
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT must be set}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    MINIO_BUCKET: ${MINIO_BUCKET:-ai-video}
    COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
    WORKSPACE_ROOT: /workspace
    WORKFLOW_DIR: /app/workflows/h3
    COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set}
    JWT_ISSUER: ${JWT_ISSUER:-ai-video-studio}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-ai-video-studio-api}
    JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-2592000}
    AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-studio_session}
    CSRF_HEADER_NAME: ${CSRF_HEADER_NAME:-X-CSRF-Token}
    IDEMPOTENCY_HOURS: ${IDEMPOTENCY_HOURS:-24}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2.0}
    LEASE_SECONDS: ${LEASE_SECONDS:-120}
    COMFY_TIMEOUT_SECONDS: ${COMFY_TIMEOUT_SECONDS:-3600}
    COMFY_SCOPED_INTERRUPT: ${COMFY_SCOPED_INTERRUPT:-false}
    MAX_GENERATION_ATTEMPTS: ${MAX_GENERATION_ATTEMPTS:-2}
    MAX_ASSEMBLY_ATTEMPTS: ${MAX_ASSEMBLY_ATTEMPTS:-2}
    MAX_PENDING_PROMPTS: ${MAX_PENDING_PROMPTS:-1}
    MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-5368709120}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
    MAX_GENERATED_OUTPUT_BYTES: ${MAX_GENERATED_OUTPUT_BYTES:-524288000}
    ASSET_VALIDATION_MAX_ATTEMPTS: ${ASSET_VALIDATION_MAX_ATTEMPTS:-3}
    ASSET_VALIDATION_TIMEOUT_SECONDS: ${ASSET_VALIDATION_TIMEOUT_SECONDS:-900}
    ASSET_VALIDATION_RETRY_SECONDS: ${ASSET_VALIDATION_RETRY_SECONDS:-30}
    MAX_MEDIA_SECONDS: ${MAX_MEDIA_SECONDS:-600}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
    FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
    FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
    FFMPEG_TIMEOUT_SECONDS: ${FFMPEG_TIMEOUT_SECONDS:-900}
    SSE_POLL_SECONDS: ${SSE_POLL_SECONDS:-1.0}
    SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-20}
    PENDING_ASSET_RETENTION_HOURS: ${PENDING_ASSET_RETENTION_HOURS:-24}
    DELETED_ASSET_RETENTION_HOURS: ${DELETED_ASSET_RETENTION_HOURS:-168}
    ORPHAN_OBJECT_RETENTION_HOURS: ${ORPHAN_OBJECT_RETENTION_HOURS:-24}
    RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
    RETENTION_DELETING_RETRY_HOURS: ${RETENTION_DELETING_RETRY_HOURS:-1}
    RETENTION_UNSELECTED_GENERATION_DAYS: ${RETENTION_UNSELECTED_GENERATION_DAYS:-30}
    RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-200}
    ASSET_OPERATION_CLAIM_TIMEOUT_SECONDS: ${ASSET_OPERATION_CLAIM_TIMEOUT_SECONDS:-900}
    UPLOAD_INTENT_GRACE_SECONDS: ${UPLOAD_INTENT_GRACE_SECONDS:-900}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS must be set}
    METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set}
    INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN:-}
    STUDIO_INGRESS_TOKEN: ${STUDIO_INGRESS_TOKEN:-}
    REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-2097152}
    BACKUP_RPO_HOURS: ${BACKUP_RPO_HOURS:-24}
    BACKUP_RTO_HOURS: ${BACKUP_RTO_HOURS:-4}
    RETENTION_FAILED_HOURS: ${RETENTION_FAILED_HOURS:-24}
    BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-/workspace/backup-status.json}
  volumes:
    - worker_workspace:/workspace
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped

x-api-signing-env: &api-signing-env
  <<: *app-env
  JWT_SECRET: ${JWT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *api-image
    environment: *api-signing-env
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      API_BACKEND_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      STUDIO_INGRESS_TOKEN: ${STUDIO_INGRESS_TOKEN:-}
      INTERNAL_PROXY_TOKEN: ${INTERNAL_PROXY_TOKEN:-}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-2097152}
      NEXT_TELEMETRY_DISABLED: "1"
      PROXY_REQUEST_BODY_TIMEOUT_MS: ${PROXY_REQUEST_BODY_TIMEOUT_MS:-60000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ingress:
    image: nginx:stable-alpine
    environment:
      STUDIO_INGRESS_TOKEN: ${STUDIO_INGRESS_TOKEN:-}
      REQUEST_BODY_MAX_BYTES: ${REQUEST_BODY_MAX_BYTES:-2097152}
      NGINX_ENVSUBST_FILTER: ^(STUDIO_INGRESS_TOKEN|REQUEST_BODY_MAX_BYTES)$$
    volumes:
      - ./ingress/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${INGRESS_PORT:-8080}:8080"
    depends_on:
      - frontend
    restart: unless-stopped

  dispatcher:
    <<: *api-image
    command: ["python", "-m", "workers.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  assembler:
    <<: *api-image
    command: ["python", "-m", "workers.assembler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  asset-validator:
    <<: *api-image
    command: ["python", "-m", "workers.asset_validation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  reconciler:
    <<: *api-image
    command: ["python", "-m", "workers.reconciliation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  worker_workspace:
