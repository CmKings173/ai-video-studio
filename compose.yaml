name: ai-video-studio

x-api-image: &api-image
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    APP_ENV: ${APP_ENV:-development}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    DATABASE_URL: postgresql+asyncpg://studio:${POSTGRES_PASSWORD:-studio}@postgres:5432/studio
    MINIO_ENDPOINT: http://minio:9000
    MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-studio}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-studio-change-me}
    MINIO_BUCKET: ai-video
    COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
    WORKSPACE_ROOT: /workspace
    WORKFLOW_DIR: /app/workflows/h3
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@local}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-password}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
    METRICS_TOKEN: ${METRICS_TOKEN:-replace-with-a-random-32-character-token}
    BACKUP_RPO_HOURS: ${BACKUP_RPO_HOURS:-24}
    BACKUP_RTO_HOURS: ${BACKUP_RTO_HOURS:-4}
    RETENTION_FAILED_HOURS: ${RETENTION_FAILED_HOURS:-24}
    RETENTION_UNSELECTED_GENERATION_DAYS: ${RETENTION_UNSELECTED_GENERATION_DAYS:-30}
    BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-/workspace/backup-status.json}
  volumes:
    - worker_workspace:/workspace
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-studio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-studio-change-me}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *api-image
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  dispatcher:
    <<: *api-image
    command: ["python", "-m", "workers.dispatcher"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  assembler:
    <<: *api-image
    command: ["python", "-m", "workers.assembler"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

  reconciler:
    <<: *api-image
    command: ["python", "-m", "workers.reconciliation"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  worker_workspace:
